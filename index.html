<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obevoir — Intelligence Personnelle</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --gold: #C9A84C; --navy: #0A1628; --text: #E8EDF5; }
  body { background: #060F1E; color: var(--text); font-family: 'DM Sans', sans-serif; margin: 0; display: flex; height: 100vh; flex-direction: column; }
  .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
  .msg { max-width: 80%; padding: 12px; border-radius: 10px; line-height: 1.5; font-size: 14px; }
  .user { align-self: flex-end; background: rgba(201,168,76,0.15); border: 1px solid var(--gold); }
  .ai { align-self: flex-start; background: #0D1A2E; border: 1px solid #1A2E4E; }
  .input-area { padding: 20px; border-top: 1px solid #1A2E4E; display: flex; gap: 10px; }
  textarea { flex: 1; background: #0D1A2E; border: 1px solid #1A2E4E; color: white; padding: 12px; border-radius: 8px; resize: none; }
  button { background: var(--gold); border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
  .typing { font-size: 12px; color: var(--gold); margin-bottom: 10px; display: none; }
</style>
</head>
<body>
  <div class="messages" id="chat">
    <div class="msg ai">Bonjour Obed. Je suis Obevoir. Comment puis-je t'aider aujourd'hui ?</div>
  </div>
  <div id="typing" class="typing" style="padding-left: 20px;">Obevoir réfléchit...</div>
  <div class="input-area">
    <textarea id="inp" placeholder="Écris ici..." rows="1"></textarea>
    <button id="btn" onclick="send()">Envoyer</button>
  </div>

<script>
const OBED_PROFILE = "Tu es OBEVOIR, l'intelligence de LOUZOLO Falone Obed. DG de LMIG. Sois direct et stratégique.";
let history = [];

async function send() {
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text) return;

  // UI
  addMsg(text, 'user');
  inp.value = '';
  document.getElementById('typing').style.display = 'block';
  
  history.push({ role: "user", parts: [{ text: text }] });

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system: OBED_PROFILE, messages: conversationHistory })
    });

    const data = await res.json();
    document.getElementById('typing').style.display = 'none';

    const reply = data.reply || "Erreur inconnue.";
    addMsg(reply, 'ai');
    history.push({ role: "model", parts: [{ text: reply }] });

  } catch (e) {
    document.getElementById('typing').style.display = 'none';
    addMsg("Erreur réseau : " + e.message, 'ai');
  }
}

function addMsg(txt, side) {
  const div = document.createElement('div');
  div.className = 'msg ' + side;
  div.innerText = txt;
  document.getElementById('chat').appendChild(div);
  document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
}

document.getElementById('inp').addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
