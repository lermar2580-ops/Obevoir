<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obevoir — Intelligence Personnelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* --- DESIGN DE LUXE OBEVOIR (CONSERVÉ) --- */
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --gold: #C9A84C; --gold-dim: rgba(201,168,76,0.12); --gold-border: rgba(201,168,76,0.25); --navy-2: #060F1E; --navy-3: #0D1A2E; --text: #E8EDF5; --text-mid: #8AA0C0; --success: #3DBE7A; }
html, body { height: 100%; overflow: hidden; background: var(--navy-2); color: var(--text); font-family: 'DM Sans', sans-serif; }
.app { display: flex; height: 100vh; }
.sidebar { width: 240px; background: var(--navy-2); border-right: 0.5px solid var(--gold-border); display: flex; flex-direction: column; flex-shrink: 0; }
.brand { padding: 24px 18px 20px; border-bottom: 0.5px solid var(--gold-border); text-align: center; }
.brand-avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #C9A84C, #8B6914); margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--navy-2); font-weight: 600; position: relative; }
.brand-avatar::after { content: ''; position: absolute; bottom: 2px; right: 2px; width: 10px; height: 10px; background: var(--success); border-radius: 50%; border: 2px solid var(--navy-2); }
.brand-name { font-family: 'Cormorant Garamond', serif; font-size: 18px; color: var(--gold); letter-spacing: 0.18em; }
.modes { padding: 15px 10px; display: flex; flex-direction: column; gap: 4px; }
.mode-btn { padding: 10px; border-radius: 7px; border: 0.5px solid transparent; background: transparent; color: var(--text-mid); font-size: 13px; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
.mode-btn.active { background: var(--gold-dim); border-color: var(--gold-border); color: var(--gold); }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { padding: 15px 22px; border-bottom: 0.5px solid var(--gold-border); display: flex; justify-content: space-between; align-items: center; }
.mode-badge { font-size: 11px; color: var(--gold); background: var(--gold-dim); border: 0.5px solid var(--gold-border); border-radius: 20px; padding: 4px 12px; }
.messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
.msg { display: flex; gap: 10px; max-width: 85%; }
.msg.ai { align-self: flex-start; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.bubble { padding: 12px 16px; border-radius: 15px; font-size: 14px; line-height: 1.6; }
.ai .bubble { background: var(--navy-3); border: 0.5px solid rgba(74,122,200,0.2); }
.user .bubble { background: var(--gold-dim); border: 0.5px solid var(--gold-border); }
.input-area { padding: 20px; border-top: 0.5px solid var(--gold-border); }
.tool-bar { display: flex; gap: 10px; margin-bottom: 12px; }
.tool-btn { padding: 6px 12px; border-radius: 6px; border: 0.5px solid var(--gold-border); background: transparent; color: var(--text-mid); font-size: 12px; cursor: pointer; }
.input-row { display: flex; gap: 10px; }
textarea { flex: 1; background: var(--navy-3); border: 0.5px solid rgba(74,122,200,0.2); border-radius: 10px; color: white; padding: 12px; resize: none; outline: none; }
.send-btn { width: 45px; background: var(--gold); border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
.file-tag { display: none; background: var(--gold-dim); color: var(--gold); padding: 4px 8px; border-radius: 4px; font-size: 11px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-avatar">O</div>
      <div class="brand-name">OBEVOIR</div>
    </div>
    <div class="modes">
      <button class="mode-btn active" onclick="setMode(this,'general')">◈ Général</button>
      <button class="mode-btn" onclick="setMode(this,'manager')">⊞ Manager</button>
      <button class="mode-btn" onclick="setMode(this,'lmig')">▣ LMIG</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar"><span class="mode-badge" id="modeBadge">Mode Général</span></div>
    <div class="messages" id="chat">
      <div class="msg ai"><div class="bubble">Prêt pour LMIG, Obed.</div></div>
    </div>
    <div class="input-area">
      <div id="fileTag" class="file-tag"></div>
      <div class="tool-bar">
        <button class="tool-btn" onclick="document.getElementById('fIn').click()">📎 Fichier</button>
        <button class="tool-btn" onclick="document.getElementById('fIn').click()">🖼 Image</button>
        <button class="tool-btn" onclick="startVoice()">🎤 Vocal</button>
      </div>
      <div class="input-row">
        <textarea id="inp" placeholder="Parle à Obevoir..." rows="1"></textarea>
        <button class="send-btn" onclick="send()">➤</button>
      </div>
    </div>
  </main>
</div>

<input type="file" id="fIn" style="display:none" onchange="handleFile(event)">

<script>
let history = [];
let currentMode = 'general';
let currentFileData = null;

function setMode(btn, m) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentMode = m;
  document.getElementById('modeBadge').innerText = 'Mode ' + m.toUpperCase();
}

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    currentFileData = { mime: file.type, data: ev.target.result.split(',')[1] };
    const tag = document.getElementById('fileTag');
    tag.innerText = "📎 " + file.name;
    tag.style.display = "inline-block";
  };
  reader.readAsDataURL(file);
}

function startVoice() {
  const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  rec.lang = 'fr-FR';
  rec.onresult = (e) => { document.getElementById('inp').value = e.results[0][0].transcript; };
  rec.start();
}

async function send() {
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text && !currentFileData) return;

  addMsg(text || "[Fichier]", 'user');
  inp.value = '';

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system: "Tu es OBEVOIR, l'IA de Obed (DG LMIG). Mode : " + currentMode,
        messages: [...history, { role: 'user', parts: [{ text: text || "Analyse ce fichier." }] }],
        fileData: currentFileData
      })
    });

    const data = await res.json();
    addMsg(data.reply, 'ai');
    history.push({ role: 'user', parts: [{ text: text }] });
    history.push({ role: 'model', parts: [{ text: data.reply }] });
    
    currentFileData = null;
    document.getElementById('fileTag').style.display = "none";
  } catch (e) {
    addMsg("Erreur de connexion au serveur Vercel.", 'ai');
  }
}

function addMsg(t, s) {
  const chat = document.getElementById('chat');
  const d = document.createElement('div');
  d.className = 'msg ' + s;
  d.innerHTML = `<div class="bubble">${t}</div>`;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
