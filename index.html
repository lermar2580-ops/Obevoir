<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obevoir — Intelligence Personnelle</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* STYLE DE LUXE OBEVOIR */
:root { --gold: #C9A84C; --navy: #060F1E; --navy-light: #0D1A2E; --text: #E8EDF5; }
body { background: var(--navy); color: var(--text); font-family: 'DM Sans', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: 240px; border-right: 1px solid rgba(201,168,76,0.2); display: flex; flex-direction: column; background: var(--navy); }
.brand { padding: 30px; text-align: center; border-bottom: 1px solid rgba(201,168,76,0.1); }
.avatar { width: 60px; height: 60px; background: linear-gradient(135deg, #C9A84C, #8B6914); border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond'; font-size: 24px; color: var(--navy); font-weight: bold; }
.main { flex: 1; display: flex; flex-direction: column; }
.messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
.bubble { padding: 12px 16px; border-radius: 12px; max-width: 80%; font-size: 14px; line-height: 1.6; }
.ai { align-self: flex-start; background: var(--navy-light); border: 1px solid rgba(74,122,200,0.2); }
.user { align-self: flex-end; background: rgba(201,168,76,0.1); border: 1px solid var(--gold); }
.input-area { padding: 20px; border-top: 1px solid rgba(201,168,76,0.2); background: var(--navy); }
.tool-bar { display: flex; gap: 10px; margin-bottom: 10px; }
.tool-btn { background: none; border: 1px solid rgba(201,168,76,0.3); color: var(--gold); padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; }
.input-row { display: flex; gap: 10px; }
textarea { flex: 1; background: var(--navy-light); border: 1px solid rgba(74,122,200,0.2); border-radius: 10px; color: white; padding: 12px; resize: none; outline: none; }
.send-btn { background: var(--gold); border: none; width: 45px; border-radius: 10px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="avatar">O</div>
      <div style="font-family:'Cormorant Garamond'; letter-spacing:2px; color:var(--gold);">OBEVOIR</div>
    </div>
    <div style="padding: 20px; font-size: 11px; color: #8AA0C0; text-transform: uppercase;">Modes</div>
    <button class="tool-btn" style="margin: 0 20px 5px;" onclick="setMode('Manager')">Manager</button>
    <button class="tool-btn" style="margin: 0 20px 5px;" onclick="setMode('Mentor')">Mentor</button>
    <button class="tool-btn" style="margin: 0 20px 5px;" onclick="setMode('LMIG')">LMIG Strategy</button>
  </aside>

  <main class="main">
    <div class="messages" id="chat">
      <div class="bubble ai">Prêt pour la stratégie LMIG, Obed.</div>
    </div>
    <div class="input-area">
      <div class="tool-bar">
        <button class="tool-btn" onclick="alert('Micro activé')">🎤 Vocal</button>
        <button class="tool-btn" onclick="alert('Explorateur ouvert')">📎 Fichier</button>
        <button class="tool-btn" style="color:white; border-color:white;">🖼 Image</button>
      </div>
      <div class="input-row">
        <textarea id="inp" placeholder="Parle à Obevoir..." rows="1"></textarea>
        <button class="send-btn" onclick="send()">➤</button>
      </div>
    </div>
  </main>

<script>
const OBED_PROFILE = "Tu es OBEVOIR, l'IA de LOUZOLO Falone Obed, DG de LMIG (Foods & Trans). Sois direct et stratégique.";
let history = [];
let currentMode = "Général";

function setMode(m) { currentMode = m; alert("Mode " + m + " activé"); }

async function send() {
  const inp = document.getElementById('inp');
  if (!inp.value.trim()) return;
  
  const text = inp.value.trim();
  addMsg(text, 'user');
  inp.value = '';
  history.push({ role: "user", parts: [{ text: text }] });

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system: OBED_PROFILE + " Mode: " + currentMode, messages: history })
    });
    const data = await res.json();
    const reply = data.reply || "Erreur de connexion.";
    addMsg(reply, 'ai');
    history.push({ role: "model", parts: [{ text: reply }] });
  } catch (e) {
    addMsg("Erreur réseau.", "ai");
  }
}

function addMsg(t, s) {
  const d = document.createElement('div');
  d.className = 'bubble ' + s;
  d.innerText = t;
  document.getElementById('chat').appendChild(d);
  document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
}
</script>
</body>
</html>
