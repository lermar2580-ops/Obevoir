<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obevoir — Intelligence Personnelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --gold: #C9A84C;
  --gold-dim: rgba(201,168,76,0.12);
  --gold-border: rgba(201,168,76,0.25);
  --gold-border-s: rgba(201,168,76,0.45);
  --navy: #0A1628;
  --navy-2: #060F1E;
  --navy-3: #0D1A2E;
  --navy-4: #112038;
  --blue-light: #4A7AC8;
  --blue-dim: rgba(74,122,200,0.12);
  --blue-border: rgba(74,122,200,0.2);
  --text: #E8EDF5;
  --text-mid: #8AA0C0;
  --text-dim: #3A5070;
  --success: #3DBE7A;
}
html, body { height: 100%; overflow: hidden; background: var(--navy-2); color: var(--text); font-family: 'DM Sans', sans-serif; }
.app { display: flex; height: 100vh; }
.sidebar { width: 220px; background: var(--navy-2); border-right: 0.5px solid var(--gold-border); display: flex; flex-direction: column; flex-shrink: 0; }
.brand { padding: 24px 18px 20px; border-bottom: 0.5px solid var(--gold-border); text-align: center; }
.brand-avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #C9A84C, #8B6914); margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; color: var(--navy-2); box-shadow: 0 0 0 1px rgba(201,168,76,0.3), 0 8px 24px rgba(201,168,76,0.15); position: relative; }
.brand-avatar::after { content: ''; position: absolute; bottom: 2px; right: 2px; width: 10px; height: 10px; background: var(--success); border-radius: 50%; border: 2px solid var(--navy-2); }
.brand-name { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 500; letter-spacing: 0.18em; color: var(--gold); margin-bottom: 3px; }
.brand-sub { font-size: 9px; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; }
.section-label { font-size: 8px; color: var(--text-dim); letter-spacing: 0.14em; text-transform: uppercase; padding: 14px 18px 6px; }
.modes { padding: 0 10px; display: flex; flex-direction: column; gap: 2px; }
.mode-btn { padding: 7px 10px; border-radius: 7px; border: 0.5px solid transparent; background: transparent; color: var(--text-mid); font-size: 12px; cursor: pointer; text-align: left; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
.mode-btn.active { background: var(--gold-dim); border-color: var(--gold-border-s); color: var(--gold); }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.status-bar { display: flex; gap: 6px; padding: 8px 22px; border-bottom: 0.5px solid var(--blue-border); background: rgba(6,12,26,0.6); }
.status-pill { display: flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 12px; background: var(--navy-3); border: 0.5px solid var(--blue-border); font-size: 10px; color: var(--text-mid); }
.status-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--success); }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px; border-bottom: 0.5px solid var(--gold-border); }
.mode-badge { font-size: 11px; color: var(--gold); background: var(--gold-dim); border: 0.5px solid var(--gold-border-s); border-radius: 20px; padding: 3px 10px; }
.messages { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 18px; }
.welcome { margin: auto; text-align: center; }
.welcome-logo { font-family: 'Cormorant Garamond', serif; font-size: 52px; color: var(--gold); letter-spacing: 0.15em; }
.msg { display: flex; gap: 10px; animation: fadeUp 0.3s ease; }
.msg.user { flex-direction: row-reverse; }
.msg-av { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; }
.msg-av.ai { background: linear-gradient(135deg, #C9A84C, #8B6914); color: var(--navy-2); }
.bubble { padding: 11px 15px; border-radius: 13px; font-size: 13.5px; line-height: 1.65; max-width: 80%; }
.ai .bubble { background: var(--navy-3); border: 0.5px solid var(--blue-border); }
.user .bubble { background: var(--gold-dim); border: 0.5px solid var(--gold-border-s); }
.input-area { border-top: 0.5px solid var(--gold-border); padding: 15px 22px; background: var(--navy-2); }
.input-row { display: flex; gap: 8px; }
textarea { flex: 1; background: var(--navy-3); border: 0.5px solid var(--blue-border); border-radius: 11px; padding: 11px; color: white; resize: none; outline: none; }
.send-btn { width: 44px; height: 44px; border-radius: 11px; background: var(--gold); border: none; cursor: pointer; }
.typing { color: var(--gold); font-size: 12px; margin-bottom: 5px; display: none; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-avatar">O</div>
      <div class="brand-name">OBEVOIR</div>
      <div class="brand-sub">Intelligence Personnelle</div>
    </div>
    <div class="section-label">Modes</div>
    <div class="modes">
      <button class="mode-btn active" onclick="setMode(this,'general','Général')">◈ Général</button>
      <button class="mode-btn" onclick="setMode(this,'manager','Manager')">⊞ Manager</button>
      <button class="mode-btn" onclick="setMode(this,'mentor','Mentor')">◎ Mentor</button>
      <button class="mode-btn" onclick="setMode(this,'precepteur','Précepteur')">◇ Précepteur</button>
      <button class="mode-btn" onclick="setMode(this,'lmig','LMIG')">▣ LMIG</button>
    </div>
  </aside>

  <main class="main">
    <div class="status-bar">
      <div class="status-pill"><span class="status-dot"></span>Actif</div>
      <div class="status-pill">Gemini 1.5 Flash</div>
    </div>
    <div class="topbar">
      <span class="mode-badge" id="modeBadge">Mode Général</span>
      <button style="background:none; border:none; color:var(--text-mid); cursor:pointer;" onclick="location.reload()">↺ Effacer</button>
    </div>
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-logo">Obevoir</div>
        <p style="color:var(--text-mid); font-style:italic;">Ton intelligence. Ta voix. Ta vision.</p>
      </div>
    </div>
    <div class="input-area">
      <div id="typingStatus" class="typing">Obevoir analyse...</div>
      <div class="input-row">
        <textarea id="inp" placeholder="Parle à Obed..." rows="1" onkeydown="handleKey(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="send()">➤</button>
      </div>
    </div>
  </main>
</div>

<script>
// VARIABLES CRUCIALES (Correction de l'erreur conversationHistory)
const OBED_PROFILE = "Tu es OBEVOIR, l'IA de Obed. DG de LMIG. Sois direct et stratégique.";
let conversationHistory = []; // Cette ligne manquait !
let currentMode = 'general';

function setMode(btn, mode, label) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentMode = mode;
  document.getElementById('modeBadge').textContent = 'Mode ' + label;
}

function addMsg(text, role) {
  const w = document.getElementById('welcome'); if (w) w.remove();
  const c = document.getElementById('messages');
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = `<div class="msg-av ${role}">${role==='ai'?'O':'OB'}</div><div class="bubble">${text}</div>`;
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
}

async function send() {
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text) return;

  addMsg(text, 'user');
  inp.value = '';
  document.getElementById('typingStatus').style.display = 'block';

  // On ajoute le message de l'utilisateur à l'historique
  conversationHistory.push({ role: 'user', parts: [{ text: text }] });

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        system: OBED_PROFILE + " " + currentMode, 
        messages: conversationHistory 
      })
    });

    const data = await res.json();
    document.getElementById('typingStatus').style.display = 'none';

    const reply = data.reply || "Désolé, je rencontre une erreur.";
    addMsg(reply, 'ai');

    // On ajoute la réponse de l'IA à l'historique
    conversationHistory.push({ role: 'model', parts: [{ text: reply }] });

  } catch (e) {
    document.getElementById('typingStatus').style.display = 'none';
    addMsg("Erreur réseau. Vérifie ta connexion.", 'ai');
  }
}

function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }
</script>
</body>
</html>
